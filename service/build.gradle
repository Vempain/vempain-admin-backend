import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'application'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.freefair.lombok)
	alias(libs.plugins.spring.dependency.management)
	id "jacoco"
}

group = 'fi.poltsi.vempain'
version = libs.versions.release.get()

bootJar {
	archiveFileName = "${rootProject.name}-${version}.jar"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
	}
}

repositories {
	mavenCentral()
	maven {
		url = "https://maven.pkg.github.com/Vempain/vempain-auth"
		credentials {
			username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
			password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
		}
	}
	maven {
		url = "https://maven.pkg.github.com/Vempain/vempain-common"
		credentials {
			username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
			password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
		}
	}
	maven { url = 'https://repo.spring.io/milestone' }
	maven { url = "https://mvn.0110.be/releases" }
}

dependencies {
	annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:${libs.versions.spring.boot.get()}"
	implementation project(':api')
	// This needs to be built first in vempain-auth
	implementation "fi.poltsi.vempain:vempain-auth-core:${libs.versions.vempain.auth.get()}"
	implementation "fi.poltsi.vempain:vempain-auth-api:${libs.versions.vempain.auth.get()}"
	implementation "fi.poltsi.vempain:vempain-common-api:${libs.versions.vempain.common.get()}"
	// Shared durable background task facility (TaskRunner, TaskProgressStore, TaskController)
	implementation "fi.poltsi.vempain:vempain-common-core:${libs.versions.vempain.common.get()}"
	implementation "org.springframework.boot:spring-boot:${libs.versions.spring.boot.get()}"
	implementation "org.springframework.boot:spring-boot-starter-security:${libs.versions.spring.boot.get()}"
	implementation "org.springframework.boot:spring-boot-starter-actuator:${libs.versions.spring.boot.get()}"
	implementation "org.springframework.boot:spring-boot-starter-validation:${libs.versions.spring.boot.get()}"
	implementation "org.springframework.boot:spring-boot-starter-jdbc:${libs.versions.spring.boot.get()}"
	implementation "org.springframework.boot:spring-boot-starter-data-jpa:${libs.versions.spring.boot.get()}"
	implementation "org.springframework.boot:spring-boot-starter-flyway:${libs.versions.spring.boot.get()}"
	implementation "io.jsonwebtoken:jjwt-api:${libs.versions.jjwt.get()}"
	implementation "org.apache.commons:commons-text:${libs.versions.commons.text.get()}"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${libs.versions.springdoc.get()}"
	runtimeOnly "org.postgresql:postgresql:${libs.versions.postgresql.get()}"
	implementation "org.json:json:${libs.versions.json.get()}"
	implementation "net.coobird:thumbnailator:${libs.versions.thumbnailator.get()}"
	implementation "com.github.mwiede:jsch:${libs.versions.jsch.get()}"
	implementation "jakarta.xml.bind:jakarta.xml.bind-api:${libs.versions.jakarta.bind.api.get()}"
	implementation "jakarta.annotation:jakarta.annotation-api:${libs.versions.jakarta.annotation.api.get()}"
	implementation "com.github.spotbugs:spotbugs-annotations:${libs.versions.spotbugs.annotations.get()}"
	implementation "org.apache.commons:commons-lang3:${libs.versions.commons.lang3.get()}"
	implementation "commons-codec:commons-codec:${libs.versions.commons.codec.get()}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${libs.versions.jjwt.get()}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${libs.versions.jjwt.get()}"
	testImplementation "org.springframework.boot:spring-boot-starter-test:${libs.versions.spring.boot.get()}"
	testImplementation "org.springframework.boot:spring-boot-starter-security-test:${libs.versions.spring.boot.get()}"
	testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test:${libs.versions.spring.boot.get()}"
	testImplementation "org.springframework.boot:spring-boot-starter-data-jpa-test:${libs.versions.spring.boot.get()}"
	testImplementation "org.testcontainers:testcontainers-junit-jupiter:${libs.versions.testcontainers.get()}"
	testImplementation "org.testcontainers:testcontainers-postgresql:${libs.versions.testcontainers.get()}"
	testImplementation "org.mockito:mockito-junit-jupiter:${libs.versions.mockito.get()}"
	// Gradle 9 no longer injects the JUnit Platform launcher; it must be on the test runtime classpath explicitly
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:${libs.versions.junit.get()}"
}

application {
	// Define the main class for the application.
	mainClass = 'fi.poltsi.vempain.VempainAdminApplication'
}

compileJava.inputs.files(processResources)

jacoco {
	toolVersion = libs.versions.jacoco.get()
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
	}
}

processResources {
	// capture once at configuration time (CC-safe)
	def ver = version.toString()
	// declare as input for configuration cache
	inputs.property("projectVersion", ver)

	filesMatching("**/application.yaml") {
		filteringCharset = "UTF-8"
		filter(ReplaceTokens,
				tokens: [projectVersion: ver]
		)
	}
}
