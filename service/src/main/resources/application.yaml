### Common settings ###
spring:
  profiles:
    default: prod
  application:
    name: Vempain Admin
  servlet:
    session:
      timeout: 600
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  session:
    store-type: jdbc
    jdbc:
      table-name: server_sessions
      cleanup-cron: "5 * * * * *"
      initialize-schema: always
  admin-datasource:
    url: override-me
    driver-class-name: org.postgresql.Driver
    username: override-me
    password: override-me
  site-datasource:
    url: override-me
    driver-class-name: org.postgresql.Driver
    username: override-me
    password: override-me
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 120MB
    max-swallow-size: 120MB

actuator:
  enabled: true
  endpoints:
    web:
      exposure:
        include: [ health, info ]

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: [ health, info ]
    access:
      default: none
  endpoint:
    health:
      access: read-only
  metrics:
    tags:
      application: vempain-admin-backend

springdoc:
  show-login-endpoint: true
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha
  show-actuator: true
  api-docs:
    enabled: true
    resolve-schema-properties: true
  use-management-port: true

logging:
  level:
    root: WARN
    fi:
      poltsi: INFO

vempain:
  developer:
    name: "Paul-Erik Törrönen"
    url: "https://poltsi.fi/"
    email: "poltsi@poltsi.fi"
  type: "Vempain Admin backend service"
  description: "Vempain admin backend serves the REST API for the frontend"
  version: @projectVersion@
  license: "GPL 2.0"
  license-url: "https://www.gnu.org/licenses/old-licenses/gpl-2.0.html"
  app:
    frontend-url: override-me
    jwt-secret: override-me
    jwt-expiration-ms: override-me
  test: false
  admin:
    file:
      image-format: "jpeg"
      thumbnail-size: 250
      site-file-directory: override-me
    ssh:
      user: override-me
      home-dir: override-me
      private-key: "${vempain.admin.ssh.home-dir}/.ssh/id_ed25519"
  site:
    www-root: override-me
    # This is the minimum dimension if the original image size is 2800x5600 then the site image size is 1400x2800
    image-size: 1400
    thumb-directory: ".thumb"
    ssh:
      user: override-me
      home-dir: override-me
      address: override-me
      port: 22
  cors:
    allowed-origins: "${vempain.app.frontend-url}"
    cors-pattern: '/**'
    max-age: 3600
  cmd-line:
    exiftool: override-me

---
### Local machine ###

spring:
  config:
    activate:
      on-profile: local
    import: classpath:local.yaml

---
### Production server ###

spring:
  config:
    activate:
      on-profile: prod
    import: classpath:prod.yaml
