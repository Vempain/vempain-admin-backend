### Common settings ###
spring:
  profiles:
    default: prod
  application:
    name: Vempain Admin
  servlet:
    session:
      timeout: 600
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  session:
    store-type: jdbc
    jdbc:
      table-name: server_sessions
      cleanup-cron: "5 * * * * *"
      initialize-schema: always
  admin-datasource:
    url: override-me
    driver-class-name: org.postgresql.Driver
    username: override-me
    password: override-me
    configuration:
      # Hikari pool name: the hikaricp.* meters of the two pools are told apart by their pool tag
      pool-name: admin
  site-datasource:
    url: override-me
    driver-class-name: org.postgresql.Driver
    username: override-me
    password: override-me
    configuration:
      pool-name: site
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    out-of-order: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 120MB
    max-swallow-size: 120MB
    # Registers the Tomcat MBeans so that Micrometer publishes the tomcat.* meters (thread pool, sessions)
    mbeanregistry:
      enabled: true

actuator:
  enabled: true
  endpoints:
    web:
      exposure:
        include: [ health, info ]

management:
  server:
    port: 8081
  tracing:
    # Tracing auto-configuration follows the deployment switch; vempain-common's MetricsExportEnvironmentPostProcessor adds the endpoint,
    # credentials, certificate bundle and sampling when it is on. The export switch is bound as well: Boot adds the [app,traceId,spanId]
    # block to the console log pattern whenever a Tracer is on the classpath and the export is not disabled, so the block appears only
    # when tracing is on (identical in the three backends).
    enabled: ${vempain.tracing.enabled}
    export:
      enabled: ${vempain.tracing.enabled}
  endpoints:
    web:
      exposure:
        include: [ health, info, openapi, swagger-ui ]
    access:
      default: none
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
    openapi:
      access: read-only
    swagger-ui:
      access: read-only
  metrics:
    tags:
      application: vempain-admin-backend
      # api for the HTTP replicas, scheduler for the scheduler replica of the swarm stack
      role: ${VEMPAIN_METRICS_ROLE:api}
      instance: ${HOSTNAME:local}
  otlp:
    metrics:
      export:
        # Push-only export: the vempain.metrics.* settings below are turned into the url, step, Authorization header and SSL bundle of this
        # exporter by the environment post-processor of vempain-common; nothing is exposed on the management port for scraping
        enabled: ${vempain.metrics.enabled}
        base-time-unit: seconds

springdoc:
  show-login-endpoint: true
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha
  show-actuator: true
  api-docs:
    enabled: true
    resolve-schema-properties: true
  use-management-port: true

logging:
  level:
    root: WARN
    fi:
      poltsi: INFO

vempain:
  name: @projectName@
  metrics:
    # OTLP/HTTP push of the application metrics to the monitoring environment (Prometheus behind Traefik basic auth with a self-signed
    # certificate); all of these come from the VEMPAIN_METRICS_* environment of the container
    enabled: ${VEMPAIN_METRICS_ENABLED:false}
    url: ${VEMPAIN_METRICS_URL:}
    username: ${VEMPAIN_METRICS_USERNAME:}
    password: ${VEMPAIN_METRICS_PASSWORD:}
    # PEM certificate (or CA) to trust for the metrics endpoint; empty uses the JVM default trust
    certificate: ${VEMPAIN_METRICS_CERTIFICATE:}
    step: ${VEMPAIN_METRICS_STEP:1m}
  tracing:
    # OTLP/HTTP push of the request traces (W3C traceparent continued from Traefik and the file backend) to the Tempo of the monitoring
    # environment; credentials and certificate are the metrics ones. Off by default so that local runs and tests never export.
    enabled: ${VEMPAIN_TRACING_ENABLED:false}
    url: ${VEMPAIN_TRACING_URL:}
    sampling: ${VEMPAIN_TRACING_SAMPLING:1.0}
  scheduling:
    enabled: ${VEMPAIN_SCHEDULING_ENABLED:true}
  tasks:
    # Shared durable background task facility (page/gallery publishing, gallery refresh, data set publishing)
    worker-count: ${VEMPAIN_TASK_WORKER_COUNT:2}
    retention-minutes: 120
    cleanup-interval-ms: 60000
    poll-interval-ms: ${VEMPAIN_TASK_POLL_INTERVAL_MS:1000}
    heartbeat-interval-ms: ${VEMPAIN_TASK_HEARTBEAT_INTERVAL_MS:10000}
    lease-seconds: ${VEMPAIN_TASK_LEASE_SECONDS:60}
  developer:
    name: "Paul-Erik Törrönen"
    url: "https://poltsi.fi/"
    email: "poltsi@poltsi.fi"
  type: "Vempain Admin backend service"
  description: "Vempain admin backend serves the REST API for the frontend"
  version: @projectVersion@
  license: "GPL 2.0"
  license-url: "https://www.gnu.org/licenses/old-licenses/gpl-2.0.html"
  app:
    frontend-url: override-me
    jwt-secret: override-me
    jwt-expiration-ms: override-me
  admin:
    api-token:
      # true when the services share a private Docker/Swarm network: the network of a new API token is then pre-filled with the
      # private network the admin backend is attached to (ENV_VEMPAIN_PRIVATE_NETWORK in compose/swarm)
      private-network: false
      # Explicit default network (CIDR) for deployments spanning hosts; empty = none
      default-network: ""
    file:
      image-format: "jpeg"
      thumbnail-size: 250
      site-file-directory: override-me
    ssh:
      user: override-me
      home-dir: override-me
      private-key: "${vempain.admin.ssh.home-dir}/.ssh/id_ed25519"
  site:
    www-root: override-me
    # This is the minimum dimension if the original image size is 2800x5600 then the site image size is 1400x2800
    image-size: 1400
    thumb-directory: ".thumb"
    ssh:
      user: override-me
      home-dir: override-me
      address: override-me
      port: 22
  cors:
    allowed-origins: "${vempain.app.frontend-url}"
    cors-pattern: '/**'
    max-age: 3600
  cmd-line:
    exiftool: override-me

---
### Local machine ###

spring:
  config:
    activate:
      on-profile: local
    import: classpath:local.yaml

---
### Production server ###

spring:
  config:
    activate:
      on-profile: prod
    import: classpath:prod.yaml
